[build-system]
requires = ["poetry-core>=1.4.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "dream_team_gpt"
version = "0.0.1"
description = "Pick your dream executive team and watch them brainstorm your idea"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = {text = "MIT"}
authors = [
    {name = "Laurence Hook", email = "hookla1976@gmail.com"},
    {name = "Stepan Sinkov", email = "supercool@duck.com"},
]
dependencies = [
    "click>=8.1.7,<9.0.0",
    "loguru>=0.7.2,<0.8.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "pyyaml>=6.0.1,<7.0.0",
    "langchain>=0.3.21,<0.4.0",
    "langchain-openai>=0.3.11,<0.4.0",
]

[project.urls]
repository = "https://github.com/hookla/DreamTeamGPT"
documentation = "https://github.com/hookla/DreamTeamGPT#readme"

# Development dependencies
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pre-commit = ">=3.4.0,<4.0.0"
pytest = ">=7.0.0,<8.0.0"
pytest-cov = ">=4.0.0,<5.0.0"
ruff = ">=0.11.2,<0.12.0"
pyright = ">=1.1.398,<2.0.0"

# Documentation dependencies
[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.4.2,<2.0.0"
mkdocs-material = ">=9.2.7,<10.0.0"
mkdocstrings = {extras = ["python"], version = ">=0.23.0,<0.24.0"}

[tool.ruff]
line-length = 99
target-version = "py311"
src = ["dream_team_gpt", "tests"]
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "COM", "C90", "ERA", "RET", "SIM", "TID", "ARG", "RUF"]
ignore = ["COM812"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
include = ["dream_team_gpt", "tests"]
exclude = ["**/__pycache__"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = "tests"