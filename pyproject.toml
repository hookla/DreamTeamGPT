[tool.poetry]
name = "dream_team_gpt"
version = "0.0.1"
description = "Pick your dream executive team and watch them brainstorm your idea"
authors = ["Laurence Hook <hookla1976@gmail.com>", "Stepan Sinkov <supercool@duck.com>"]
repository = "https://github.com/hookla/DreamTeamGPT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
backoff = "^2.2.1"
click = "~=8.1.7"
loguru = "~=0.7.2"
python-dotenv = "~=1.0.0"
pyyaml = "~=6.0.1"
langchain = "^0.3.21"
langchain-openai = "^0.3.11"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.4.0"
pytest = "*"
pytest-cov = "^4.0.0"
ruff = "^0.11.2"
pyright = "^1.1.398"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.4.2"
mkdocs-material = "^9.2.7"
mkdocstrings = {extras = ["python"], version = "^0.23.0"}

[build-system]
requires = ["poetry-core>=1.4.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 99
target-version = "py311"
src = ["dream_team_gpt", "tests"]
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "COM", "C90", "ERA", "RET", "SIM", "TID", "ARG", "RUF"]
ignore = ["COM812"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
include = ["dream_team_gpt", "tests"]
exclude = ["**/__pycache__"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = "tests"